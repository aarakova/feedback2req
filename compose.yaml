name: feedback2req
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: feedback2req
      POSTGRES_USER: feedback2req
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback2req -d feedback2req"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      F2R_DATABASE_URL: postgresql+psycopg://feedback2req:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db/feedback2req
      F2R_ALLOWED_ORIGIN: ${F2R_ALLOWED_ORIGIN:-http://localhost:8000}
      F2R_LOCAL_HTTP: ${F2R_LOCAL_HTTP:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
