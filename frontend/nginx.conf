# Docker DNS is re-resolved when backend is recreated. No cached container IP.
resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;
upstream application {
    zone application 64k;
    server backend:8000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location ^~ /api {
        proxy_pass http://application;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Replace, never append to untrusted client headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        # Backend owns the approved byte limit and JSON 413 error contract.
        client_max_body_size 0;
    }

    location / {
        # Hash routing needs no SPA fallback, and unknown/private paths stay 404.
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
    }
}
