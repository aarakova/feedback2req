function verificationHTML(r){const i=r.issue;return `<div class="notice ${r.verification==='current'?'good':'warn'}"><strong>${r.verification==='current'?'Проверка относится к этой редакции':'Эта редакция требует проверки'}</strong><p>Редакция r${r.revision} · выбранные состояния оснований. AI-проверка не является человеческим утверждением.</p></div><div class="space">${i?`<article class="issue"><div class="row wrap">${badge('Серьёзность: '+i.severity,i.severity==='Высокая'?'bad':'warn')}${badge(i.blocking?'Блокирует новое утверждение':'Не блокирует утверждение',i.blocking?'bad':'')}${i.resolved?badge('Явно разрешено','good'):badge('Открыто','warn')}</div><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p>${i.findingIds?conflictPairHTML(i.findingIds,r.basisStates):''}<div class="mono muted space">${i.id} · редакция r${r.revision}</div>${i.resolved?`<div class="notice good space"><strong>Неприменимо по решению Approver</strong><p>${esc(i.resolution)}</p><p>Исходное замечание сохранено в истории.</p></div>`:`<div class="row wrap space">${btn('Признать неприменимым','resolve',`data-id="${r.id}" ${!canApprove()?'disabled':''}`)}${btn(icon('edit')+'Исправить формулировку','edit',`data-id="${r.id}" ${r.decision==='Rejected'?'disabled':''}`)}</div>`}</article>`:'<div class="notice">В демонстрационной проверке замечаний нет. Наличие ссылок само по себе не доказывает смысловую достаточность основания.</div>'}</div>${historicalIssuesHTML(r)}${btn(icon('refresh')+'Проверить эту редакцию','verify',`data-id="${r.id}" ${!availability(r).available?'disabled':''}`,'subtle')}<p class="small muted space">Повтор создаёт отдельный результат. Исчезновение замечания из ответа AI само по себе не закрывает прежний блокер.</p>`;}
function findingHistoryHTML(f){const items=[];let old=f.previous;while(old){items.push(old);old=old.previous;}return items.length?`<details class="notice space"><summary>Предыдущие состояния находки · ${items.length}</summary>${items.map((v,i)=>`<div class="space">${badge(v.humanEdit?'Правка человека':'Результат AI',v.humanEdit?'warn':'blue')}<p style="margin-top:7px">${esc(v.text)}</p><p class="small muted">${v.types.map(esc).join(', ')} · ${esc(v.group)}</p></div>`).join('')}</details>`:'';}
function historicalIssuesHTML(r){const old=allIssues(r).filter(i=>i.id!==r.issue?.id);return old.length?`<div class="space"><span class="label-field">Замечания прежних проверок</span>${old.map(i=>`<article class="issue"><div class="row wrap">${badge(i.resolved?'Явно разрешено':'Открыто',i.resolved?'good':'warn')}${badge(i.blocking?'Блокирующее':'Неблокирующее',i.blocking?'bad':'')}</div><h3>${esc(i.title)}</h3><p>${esc(i.text)}</p>${i.findingIds?conflictPairHTML(i.findingIds,r.savedRevisions?.find(v=>v.revision===i.revision)?.basisStates||r.basisStates):''}<div class="mono muted space">${esc(i.id)} · прежняя редакция r${i.revision}</div>${i.resolved?`<p class="small space">Обоснование: ${esc(i.resolution)}</p>`:`<div class="space">${btn('Признать неприменимым','resolve',`data-id="${r.id}" data-issue-id="${i.id}" ${!canApprove()?'disabled':''}`)}</div>`}</article>`).join('')}</div>`:'';}
function revisionHistoryHTML(r){return (r.savedRevisions||[]).length?`<div class="space"><span class="label-field">Сохранённые содержательные редакции</span>${r.savedRevisions.map(v=>`<div class="notice space"><strong>r${v.revision} · ${v.decision?decisionLabel[v.decision]:'сохранённая формулировка'}</strong><p>${esc(v.text)}</p><p class="small muted">Основания: ${v.findings.map(id=>esc(v.basisStates?.find(f=>f.id===id)?.text||finding(id)?.text||'Вывод недоступен')).join('; ')}. Состояния оснований сохранены с учётом удаления источников.</p></div>`).join('')}</div>`:'';}
function historyHTML(r){return `${r.history.map(h=>`<div class="history-item"><h3 class="small">${esc(h.text)}</h3><p>${esc(h.who)}${h.at?' · '+esc(h.at):''}</p>${h.savedText?`<p style="color:var(--ink)">«${esc(h.savedText)}»</p>`:''}</div>`).join('')}${revisionHistoryHTML(r)}<div class="notice">Сохранённая редакция неизменяема. Проверка и решение прежней редакции не переносятся на новую.</div>`;}
function detail(r,surface='inline'){

}

class="panel-head"><div><span class="panel-title">Документация продукта</span><p class="small muted">Контекст для анализа</p></div>${btn(icon('plus')+'Добавить документ','upload-document','','subtle')}</div>${data.documents.map(d=>`<article class="source-card"><div class="file-icon">${icon('file')}</div><div><h3>${esc(d.name)}</h3><p>Версия ${d.version} · ${d.pending?'ждёт обработки':'контекст продукта'}</p><button class="source-link" data-action="document" data-id="${d.id}">Просмотреть →</button></div></article>`).join('')}<div class="panel-body"><p class="small muted">Документация помогает понять продукт и обнаружить расхождения. Самостоятельно она не обосновывает новую пользовательскую потребность.</p></div></section></div>`;}

 const done=data.run.retry,uncertain=data.sources.filter(s=>!s.deleted&&s.segments?.some(seg=>seg.unreliable)),running=data.run.status==='running';
 const stages=[['Подготовка','Текст и распознавание речи',uncertain.length?'Есть ненадёжное распознавание':'Открытых ненадёжных участков нет'],['Анализ','Находки и группы','Пригодные части сохранены'],['Формирование','Проекты требований',done?'Повтор выполнен':'Ошибка независимой части'],['Проверка','Замечания и вопросы',stats().blockers+' требований с открытыми блокерами']];
 return heading('Обработка','Результаты и действия в каждом этапе.',btn(icon('play')+(running?'Выполняется…':'Запустить обработку'),'start-processing',running?'disabled':'','primary'))+`<div class="run-header"><div class="row between wrap"><div><span class="small muted">Последний демонстрационный запуск</span><h3 class="space">${running?'Выполняется обработка':done?'Технический повтор завершён':'Обработка завершена частично'}</h3></div>${badge(running?'В процессе':done?'Пригодные результаты сохранены':'Неполный охват',done?'good':'warn')}</div><p class="small muted space">Независимые пригодные результаты доступны, даже если другой участок ненадёжен или завершился ошибкой.</p></div><div class="stage-track">${stages.map((st,i)=>`<section class="stage ${i===2&&!done?'error':''}"><span class="step-num">0${i+1}</span><h3>${st[0]}</h3><p>${st[1]}</p><div class="space">${badge(st[2],i===2&&!done?'bad':i===0&&uncertain.length?'warn':'good')}</div><div class="stage-actions space">${i===0?uncertain.flatMap(s=>s.segments.filter(seg=>seg.unreliable).map(seg=>btn(icon('audio')+'Проверить участок · '+esc(seg.time),'uncertain',`data-id="${s.id}" data-segment="${seg.id}"`,'subtle'))).join(''):i===1?btn('Открыть находки','navigate','data-view="findings"'):i===2?btn(done?'Результат повтора':'Посмотреть ошибку','stage-error','','subtle'):btn('Открыть требования','navigate','data-view="requirements"')}</div></section>`).join('')}</div>`;

function analyticsView(){const s=stats(),colors=['#8daaff','#5dceb1','#ed969e'];const a=s.all?s.draft/s.all*100:0,b=s.all?s.approved/s.all*100:0;const cats=[['approved_all','Доступны все основания',r=>availability(r).available===availability(r).total,'good'],['approved_partial','Частичная утрата',r=>availability(r).available>0&&availability(r).available<availability(r).total,'warn'],['approved_lost','Полная утрата',r=>availability(r).available===0,'bad']];return heading('Обзор проекта','Обратная связь, требования и вопросы, которые требуют вашего внимания.')+metrics()+`<div class="twos"><section class="panel"><div class="panel-head"><div><span class="panel-title">Группы обратной связи</span><p class="small muted">Нажмите на группу, чтобы открыть связи</p></div>${badge(s.findings+' находок')}</div><div class="panel-body groups-body">${groups().map(groupRow).join('')}<p class="small muted space">Количество находок, а не уникальных участников. Замечания относятся к связанным требованиям.</p></div></section><section class="panel"><div class="panel-head"><span class="panel-title">Решения по требованиям</span><span class="small muted">Решение человека</span></div><div class="panel-body"><div class="donut" role="img" aria-label="Черновиков ${s.draft}, утверждено ${s.approved}, отклонено ${s.rejected}" style="background:conic-gradient(${colors[0]} 0 ${a}%,${colors[1]} ${a}% ${a+b}%,${colors[2]} ${a+b}% 100%)"><div class="center"><strong>${s.all}</strong><small>требований</small></div></div><div class="legend decision-legend">${[['draft','Черновик',s.draft,colors[0]],['approved','Утверждено',s.approved,colors[1]],['rejected','Отклонено',s.rejected,colors[2]]].map(([key,label,n,col])=>`<button data-action="filter" data-filter="${key}"><i style="background:${col}"></i><span>${label}</span><b>${n}</b></button>`).join('')}</div><p class="small muted space">Три категории человеческого решения. Предложения изменений не считаются отдельными требованиями.</p></div></section></div><div class="twos space"><section class="panel"><div class="panel-head"><span class="panel-title">Нуждается во внимании</span>${icon('shield')}</div>${data.requirements.filter(r=>allIssues(target(r)).some(i=>!i.resolved)||availability(r).available<availability(r).total||target(r).verification!=='current').map(r=>`<button class="req-row" data-action="review-req" data-id="${r.id}"><div class="row between"><span class="mono muted">${r.id}</span>${decisionBadge(r)}</div><div class="title">${esc(r.title)}</div><div class="row wrap">${miniStatus(r)}</div></button>`).join('')||'<div class="empty">Открытых случаев нет</div>'}</section><section class="panel"><div class="panel-head"><span class="panel-title">Основания утверждённых требований</span></div><div class="panel-body">${cats.map(([key,label,test,tone])=>`<button class="availability-row" data-action="filter" data-filter="${key}"><span>${label}</span><div class="row">${badge(data.requirements.filter(r=>r.decision==='Approved'&&test(r)).length,tone)}${icon('arrow')}</div></button>`).join('')}<p class="small muted space">Каждая категория открывает свою выборку, в том числе пустую.</p><div class="notice warn space">Утрата источника не отменяет историческое утверждение. Доступность и смысловая достаточность оснований оцениваются отдельно.</div></div></section></div><p class="small muted space">Обзор относится к доступным результатам частичной обработки. В демо показаны все три случая доступности оснований.</p>`;}
function accessView(){return heading('Доступ и настройки','Участники и их полномочия в этом проекте.')+`<div class="twos"><section class="panel"><div class="panel-head"><span class="panel-title">Участники проекта</span>${btn(icon('plus')+'Добавить участника','add-member',!canDelete()?'disabled':'','primary')}</div>${data.members.map((m,i)=>`<div class="source-card"><div class="avatar">${i?'A':'ВЫ'}</div><div class="grow"><h3>${esc(m.name)}</h3><p>${esc(m.role)}</p></div>${i?btn(m.role.includes('Approver')?'Снять Approver':'Дать Approver','grant',`data-index="${i}" ${!canDelete()?'disabled':''}`):badge('Создатель','blue')}</div>`).join('')}<div class="panel-body"><p class="small muted">Роль в шапке позволяет проверить доступность действий в демо.</p></div></section><section class="panel"><div class="panel-head"><span class="panel-title">Настройки проекта</span></div><div class="panel-body"><div class="field"><label for="projectName">Название</label><input id="projectName" value="${esc(data.project)}" ${!canDelete()?'disabled':''}></div><div class="space">${btn('Сохранить название','rename',!canDelete()?'disabled':'')}</div><div class="divider"></div><h3>Удаление проекта</h3><p class="small muted space">Материалы, результаты и история проекта будут недоступны. Учётная запись останется.</p><div class="space">${btn(icon('trash')+'Удалить демо-проект','delete-project',!canDelete()?'disabled':'','danger')}</div></div></section></div>`;}

   if(r.proposal){if(decision==='Approved'){const old=JSON.parse(JSON.stringify(r));delete old.proposal;delete old.history;delete old.savedRevisions;r.savedRevisions=r.savedRevisions||[];if(!r.savedRevisions.some(v=>v.revision===old.revision))r.savedRevisions.push(old);Object.assign(r,r.proposal);r.decision='Approved';}else{const rejected=JSON.parse(JSON.stringify(r.proposal));rejected.decision='Rejected';r.savedRevisions=r.savedRevisions||[];r.savedRevisions.push(rejected);}r.proposal=null;}

 if(action==='save-upload'){

function reqCard(r){const a=availability(r),t=target(r);return `<button class="kanban-card" data-action="review-req" data-id="${r.id}"><div class="row between"><span class="mono muted">${r.id}</span><span class="decision-marker ${r.decision.toLowerCase()}"></span></div><h3>${esc(r.title)}</h3><p class="card-excerpt">${esc(t.text)}</p><div class="row wrap">${a.available<a.total?badge(a.label,a.tone):badge('Основания доступны','good')}${allIssues(t).some(i=>i.blocking&&!i.resolved)?badge('Открыт блокер','warn'):''}${t.verification!=='current'?badge('Требует проверки','warn'):''}${r.proposal?badge('Предложение изменения','blue'):''}</div><div class="row between bottom"><span class="list-meta">Редакция ${r.revision} · ${ruCount(r.findings.length,'находка','находки','находок')}</span><span class="source-link">Рассмотреть ${icon('arrow')}</span></div></button>`;}

function relatedRequirements(g){const ids=new Set(g.items.map(f=>f.id));return data.requirements.filter(r=>[...r.findings,...(r.proposal?.findings||[])].some(id=>ids.has(id)));}

function relatedIssues(g){return relatedRequirements(g).flatMap(r=>allIssues(target(r)).map(issue=>({r,issue})));}

function ruCount(n,one,few,many){const rem=n%100,last=n%10;return n+' '+(rem>=11&&rem<=14?many:last===1?one:last>=2&&last<=4?few:many);}
function groupSummary(g){return {findings:g.items.length,requirements:relatedRequirements(g).length,issues:relatedIssues(g).filter(x=>!x.issue.resolved).length};}

function groupRow(g){const n=groupSummary(g),max=Math.max(1,...groups().map(x=>x.items.length));return `<button class="group-summary" data-action="open-group" data-group="${esc(g.name)}"><div class="row between"><strong>${esc(g.name)}</strong>${icon('arrow')}</div><div class="bar"><span style="width:${n.findings/max*100}%"></span></div><div class="group-counts"><span>${ruCount(n.findings,'находка','находки','находок')}</span><span>${ruCount(n.requirements,'требование','требования','требований')}</span><span>${ruCount(n.issues,'открытое замечание','открытых замечания','открытых замечаний')}</span></div></button>`;}

function basisPickerHTML(t){return `<div class="field space"><label>Какие отзывы подтверждают эту формулировку?</label><p class="small muted">Отметьте подходящие выводы из отзывов. Выбирайте по смыслу и цитате: каждый отмеченный вывод станет основанием новой редакции.</p><div class="stack" style="gap:10px">${data.findings.map(f=>{const s=source(f.source);return `<div class="basis-option ${s.deleted?'unavailable':''}"><label class="basis-check"><input type="checkbox" name="basis" value="${f.id}" ${t.findings.includes(f.id)?'checked':''} ${s.deleted?'disabled':''}><span><strong>${esc(f.text)}</strong><span class="small muted" style="display:block;margin-top:5px">${esc(f.group)} · ${esc(f.mode)}</span></span></label><div class="basis-preview">${s.deleted?badge('Исходное основание удалено','bad'):`<span class="small muted">${esc(s.name)} · ${esc(f.time)}</span><blockquote class="quote"><p>«${esc(f.quote)}»</p><button class="source-link" data-action="source" data-id="${s.id}">Открыть источник ↗</button></blockquote>`}</div></div>`;}).join('')}</div></div>`;}
function uploadModalHTML(m){const doc=m.category==='document';return modalFrame(doc?'Добавить документацию продукта':'Добавить обратную связь',`<p class="small muted">${doc?'Документ используется как контекст продукта.':'Добавьте отзыв текстом или выберите файл с текстом, аудио или видео. Тип отзыва определяется по выбранному файлу.'}</p><div class="upload-zone space">${icon('upload')}<h3 style="margin-top:10px">${doc?'Документ продукта':'Файл обратной связи'}</h3><p>Файл не отправляется на сервер. Аудио и видео можно прослушать локально; распознавание и анализ моделируются</p><input type="file" id="demoFile" aria-label="${doc?'Документ':'Файл отзыва'}" style="max-width:100%"></div><div class="field"><label for="materialName">Название</label><input id="materialName" placeholder="${doc?'Например, описание текущего продукта':'Например, интервью о поиске'}"></div><div class="field space"><label for="materialText">${doc?'Текст документа (необязательно)':'Текст отзыва (необязательно)'}</label><textarea id="materialText" placeholder="${doc?'Контекст, который поможет понять продукт':'Можно вставить отзыв вместо выбора файла'}"></textarea></div><div class="notice space">Добавление материала и запуск обработки — отдельные действия. «Добавить и обработать» явно выполняет оба шага в демо.</div><div class="row wrap space">${btn('Добавить','save-upload')}${btn(icon('play')+'Добавить и обработать','save-upload','data-start="true"','primary')}${btn('Отмена','close-modal')}</div>`);}

function uncertainModalHTML(m){const s=source(m.id),seg=s.segments.find(seg=>seg.id===m.segment)||s.segments.find(seg=>seg.unreliable)||s.segments.at(-1);return modalFrame('Проверка участка распознавания',`<div class="row between wrap"><h3>${esc(s.name)}</h3><span class="time">${esc(seg.time)}</span></div>${mediaHTML(s,seg)}<div class="notice warn space">${seg.unreliable?'Этот участок распознан ненадёжно. Он не использован как уверенное основание.':'Участок исправлен человеком. Исходный результат сохранён для сравнения.'}</div><span class="label-field space">Исходное распознавание</span><blockquote class="quote"><p>${esc(seg.originalText||seg.text)}</p></blockquote><p class="small muted space">Контекст: ${esc(s.segments.find(x=>x.id!==seg.id)?.text||'')}</p><div class="field space"><label for="segmentText">Уточнённый текст участка</label><textarea id="segmentText">${esc(seg.text)}</textarea></div><label class="row small space"><input type="checkbox" id="segmentReliable" ${!seg.unreliable?'checked':''}><span>Пометить текст как проверенный человеком после прослушивания</span></label><div class="row wrap space">${btn('Сохранить исправление','save-segment',`data-id="${s.id}" data-segment="${seg.id}"`,'primary')}${btn('Отмена','close-modal')}</div>`);}
function requirementEditorHTML(r){
 const t=target(r),d=ui.editDraft?.id===r.id?ui.editDraft:{text:t.text,findings:t.findings};
 return `<div class="requirement-editor"><div class="field"><label for="editText">${r.decision==='Approved'?'Новая предлагаемая формулировка':'Формулировка требования'}</label><textarea id="editText" rows="5">${esc(d.text)}</textarea></div>${basisPickerHTML({...t,findings:d.findings})}<div class="notice space">Сохранение создаст новую редакцию. Она потребует отдельной проверки. ${r.decision==='Approved'?'Действующее утверждённое требование сохранится до принятия предложения.':'Прежняя редакция останется в истории.'}</div><div class="editor-actions row wrap space">${btn(icon('check')+'Сохранить новую редакцию','save-edit',`data-id="${r.id}"`,'primary')}${btn('Отменить правки','cancel-edit')}</div></div>`;
}

function conflictPairHTML(ids=['F-03','F-04'],states=null){
 const fs=ids.map(id=>states?.find(f=>f.id===id)||finding(id)).filter(Boolean);if(fs.length<2)return '';
 return `<section class="conflict-pair"><div class="row between wrap"><strong>${icon('shield')} Конфликтующие позиции</strong>${badge('Нужно решение человека','warn')}</div><p class="small muted space">Оба отзыва о составе уведомлений. Требование должно учитывать расхождение${fs.some(f=>f.humanEdit)?'; после правок его нужно проверить заново':''}.</p><div class="conflict-positions">${fs.map((f,i)=>{const s=source(f.source);return `<article><span class="position-label">Позиция ${i+1}</span><h3>${esc(f.text)}</h3>${s?.deleted?badge('Исходный фрагмент утрачен','bad'):`<blockquote>«${esc(f.quote)}»</blockquote><button class="source-link" data-action="source" data-id="${s.id}">${esc(s.name)} · ${esc(f.time)} ↗</button>`}<div class="space">${btn('Открыть находку','open-finding',`data-id="${f.id}"`)}</div></article>`;}).join('')}</div></section>`;
}

function timeSeconds(value){const parts=value.trim().split(':').map(Number);if(parts.some(x=>!Number.isFinite(x)||x<0))return 0;return parts.reduce((n,x)=>n*60+x,0);}

function segmentRange(seg){const [start,end]=seg.time.split(/[–—-]/);return [timeSeconds(start),timeSeconds(end||start)];}

function releaseMedia(id){const m=localMedia.get(id);if(m){URL.revokeObjectURL(m.url);localMedia.delete(id);}}

function clearMedia(){for(const id of [...localMedia.keys()])releaseMedia(id);}

function attachMedia(id,file){if(!source(id)||source(id).deleted||!/^audio\/|^video\//.test(file?.type||''))return false;releaseMedia(id);localMedia.set(id,{url:URL.createObjectURL(file),name:file.name,kind:file.type.startsWith('video/')?'video':'audio'});return true;}

function mediaHTML(s,seg=null){
 if(s.kind==='text')return '';const m=localMedia.get(s.id),range=seg?segmentRange(seg):null;
 return `<section class="media-check space"><div class="row between wrap"><strong class="small">${icon('audio')} Исходная запись</strong>${m?badge('Локальный файл','blue'):badge('Запись не прикреплена','warn')}</div>${m?`<p class="small muted space">${esc(m.name)}</p><${m.kind} id="sourceMediaPlayer" controls preload="metadata" src="${esc(m.url)}" aria-label="Исходная запись" ${range?`data-start="${range[0]}" data-end="${range[1]}"`:''}></${m.kind}>${range?`<div class="space">${btn(icon('play')+'Прослушать участок '+esc(seg.time),'play-segment',`data-start="${range[0]}" data-end="${range[1]}"`,'primary')}</div>`:''}`:`<p class="small muted space">В демонстрационных данных нет записи. Прикрепите аудио или видео, чтобы прослушать указанный интервал.</p>`}<label class="media-file-label space">${m?'Заменить запись':'Прикрепить запись для прослушивания'}<input type="file" class="local-recording" data-source="${s.id}" accept="audio/*,video/*" aria-label="Прикрепить исходную запись"></label><p class="small muted space">Файл воспроизводится в этой вкладке и не отправляется на сервер. ${s.segments?'Интервалы в примере демонстрационные: используйте запись с соответствующей временной шкалой.':''}</p></section>`;
}

function playSegment(start,end){
 const player=$('#sourceMediaPlayer');if(!player)return;
 const play=()=>{if(Number.isFinite(player.duration)&&start>=player.duration){toast('В записи нет этого интервала. Выберите соответствующий файл или используйте шкалу плеера');return;}player.currentTime=start;player.dataset.clipEnd=String(end);const result=player.play();result?.catch(()=>toast('Не удалось воспроизвести запись. Проверьте формат файла'));};
 if(player.readyState>=1)play();else player.addEventListener('loadedmetadata',play,{once:true});
}

function bindMediaPlayer(){const player=$('#sourceMediaPlayer');if(!player)return;player.addEventListener('timeupdate',()=>{const end=Number(player.dataset.clipEnd);if(end>0&&player.currentTime>=end){player.pause();delete player.dataset.clipEnd;}});player.addEventListener('error',()=>toast('Браузер не смог открыть запись. Попробуйте другой аудио- или видеофайл'));}

initialise();render();
</script>
</body>
</html>
