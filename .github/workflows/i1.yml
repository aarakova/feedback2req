name: Backend, deployment, browser and AI contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: extraction-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.extraction-test.yaml
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t feedback2req-backend .
      - run: docker build -f backend/Dockerfile.checks -t feedback2req-checks .
      - run: docker compose up -d --wait db api provider worker
      - run: docker compose run --rm checks seed
      - name: Safe unhealthy and actual probe-triggered restart
        run: |
          docker compose exec -T worker python /checks/probe.py corrupt
          worker_id="$(docker compose ps -q worker)"
          before="$(docker inspect -f '{{.RestartCount}}' "$worker_id")"
          docker compose exec -T worker python /checks/probe.py hang
          for tick in $(seq 1 40); do
            after="$(docker inspect -f '{{.RestartCount}}' "$worker_id")"
            if test "$after" -gt "$before"; then break; fi
            sleep 1
          done
          test "$after" -gt "$before"
          docker compose up -d --wait worker
          docker compose run --rm checks verify
      - name: Backend, worker and database persistence
        run: |
          docker compose stop api worker
          docker compose restart db
          docker compose up -d --wait api worker
          docker compose run --rm checks verify
      - run: docker compose run --rm checks failure
      - run: docker compose run --rm checks slow
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  i1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: feedback2req_i1_test
          POSTGRES_USER: f2r_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U f2r_test -d feedback2req_i1_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      F2R_TEST_DATABASE_URL: postgresql+psycopg://f2r_test@localhost:5432/feedback2req_i1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.lock
      - run: python -m pip install -r backend/requirements-test.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m ruff check backend scripts/check_i1_restart.py
      - run: python -m pytest backend/tests -q -W error
      - run: python scripts/validate_ai_contracts.py
      - name: Start isolated restart database
        env:
          F2R_TEST_COMPOSE_PROJECT: feedback2req-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f compose.test.yaml -p "$F2R_TEST_COMPOSE_PROJECT" up -d --wait db
      - name: Full API and PostgreSQL stop/start with material persistence
        env:
          F2R_TEST_DATABASE_URL: postgresql+psycopg://f2r_test@127.0.0.1:55433/feedback2req_i1_test
          F2R_TEST_COMPOSE_PROJECT: feedback2req-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/check_i1_restart.py
      - name: Stop isolated restart database
        if: always()
        env:
          F2R_TEST_COMPOSE_PROJECT: feedback2req-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -f compose.test.yaml -p "$F2R_TEST_COMPOSE_PROJECT" stop db
  deployment:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: infrastructure-test-only
      F2R_LOCAL_HTTP: "true"
      F2R_TEST_DATABASE_URL: postgresql+psycopg://f2r_test@127.0.0.1:55433/feedback2req_i1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-test.lock
      - run: python -m pip install --no-deps -e backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build independent runtime images
        run: docker compose build backend frontend worker
      - name: Start isolated deployment and worker infrastructure check
        run: |
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --no-build
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --wait backend frontend
          mkdir -p .local
      - name: Require healthy executing worker
        run: |
          worker_id="$(docker compose -f compose.yaml -f compose.infrastructure-test.yaml ps -aq worker)"
          test -n "$worker_id"
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --wait worker
      - name: Real Nginx HTTP, cookies, CSRF, materials and isolation
        run: docker run --rm --user 0 --network feedback2req-infra-test_proxy --mount "type=bind,source=$PWD,target=/workspace" --mount "type=bind,source=$PWD/.local,target=/state" -w /workspace feedback2req-backend python scripts/check_infrastructure.py smoke
      - name: Restart isolated database and backend
        run: |
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml stop backend
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml restart db
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --wait backend frontend
      - name: Change backend IP without restarting Nginx
        env:
          F2R_TEST_BACKEND_PROXY_IP: 172.28.244.5
        run: docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --no-deps --wait backend
      - name: Verify exact saved materials and session through Docker DNS
        run: docker run --rm --user 0 --network feedback2req-infra-test_proxy --mount "type=bind,source=$PWD,target=/workspace" --mount "type=bind,source=$PWD/.local,target=/state" -w /workspace feedback2req-backend python scripts/check_infrastructure.py verify
      - name: Configure isolated rate limit
        env:
          F2R_TEST_LOGIN_LIMIT: "2"
        run: docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --no-deps --wait backend
      - name: Reject forged proxy headers from direct and proxied peers
        run: docker run --rm --network feedback2req-infra-test_proxy --mount "type=bind,source=$PWD,target=/workspace" -w /workspace feedback2req-backend python scripts/check_infrastructure.py rate
      - name: Restore browser test settings
        run: docker compose -f compose.yaml -f compose.infrastructure-test.yaml up -d --no-deps --wait backend
      # Full browser suites have their own synthetic PG/provider/seed/worker
      # environment in workflow-ui.yml; this stack deliberately has no AI.
      - name: Stop isolated services; preserve volumes
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.infrastructure-test.yaml stop
          docker compose -f compose.test.yaml stop db
